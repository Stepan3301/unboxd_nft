<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%; transform: translate3d(0px, 0px, 0px); content-visibility: visible;">
  <defs>
    <radialGradient id="darkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#330011" stop-opacity="1"/>
      <stop offset="50%" stop-color="#660022" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#110005" stop-opacity="0.9"/>
    </radialGradient>
    
    <linearGradient id="obeliskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0015"/>
      <stop offset="50%" stop-color="#2a0008"/>
      <stop offset="100%" stop-color="#1a0004"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark aura background -->
  <circle cx="256" cy="256" r="250" fill="url(#darkAura)" opacity="0.8"/>
  
  <!-- Main obelisk body -->
  <g transform="translate(256,256)">
    <!-- Central obelisk shape -->
    <path fill="url(#obeliskGradient)" stroke="#ff0033" stroke-width="2" 
          d="M0,-180 L-40,-160 L-60,-60 L-80,60 L-40,160 L40,160 L80,60 L60,-60 L40,-160 Z"/>
    
    <!-- Cat features -->
    <!-- Eyes with glowing effect -->
    <circle cx="-25" cy="-80" r="12" fill="#ff0000" filter="url(#glow)" opacity="0.9"/>
    <circle cx="25" cy="-80" r="12" fill="#ff0000" filter="url(#glow)" opacity="0.9"/>
    
    <!-- Eye pupils -->
    <circle cx="-25" cy="-80" r="4" fill="#000000"/>
    <circle cx="25" cy="-80" r="4" fill="#000000"/>
    
    <!-- Nose -->
    <polygon points="0,-55 -8,-45 8,-45" fill="#cc0022"/>
    
    <!-- Mouth -->
    <path d="M0,-45 Q-15,-30 -25,-20 Q0,-35 25,-20 Q15,-30 0,-45" 
          fill="none" stroke="#ff0033" stroke-width="3"/>
    
    <!-- Whiskers -->
    <line x1="-60" y1="-60" x2="-35" y2="-55" stroke="#ff0033" stroke-width="2"/>
    <line x1="-60" y1="-40" x2="-35" y2="-45" stroke="#ff0033" stroke-width="2"/>
    <line x1="35" y1="-55" x2="60" y2="-60" stroke="#ff0033" stroke-width="2"/>
    <line x1="35" y1="-45" x2="60" y2="-40" stroke="#ff0033" stroke-width="2"/>
    
    <!-- Ears -->
    <polygon points="-35,-160 -55,-120 -15,-130" fill="url(#obeliskGradient)" stroke="#ff0033"/>
    <polygon points="35,-160 55,-120 15,-130" fill="url(#obeliskGradient)" stroke="#ff0033"/>
    
    <!-- Dark mystical symbols -->
    <g fill="#ff3333" opacity="0.8" font-family="serif" font-weight="bold" text-anchor="middle">
      <text x="0" y="0" font-size="24">◊</text>
      <text x="-40" y="40" font-size="18">✦</text>
      <text x="40" y="40" font-size="18">✦</text>
      <text x="0" y="80" font-size="20">◆</text>
    </g>
    
    <!-- Mystical aura lines -->
    <g stroke="#ff0033" stroke-width="1" opacity="0.6" fill="none">
      <circle cx="0" cy="0" r="120"/>
      <circle cx="0" cy="0" r="140"/>
      <circle cx="0" cy="0" r="160"/>
    </g>
    
    <!-- Paws/base -->
    <ellipse cx="-30" cy="140" rx="20" ry="15" fill="url(#obeliskGradient)"/>
    <ellipse cx="30" cy="140" rx="20" ry="15" fill="url(#obeliskGradient)"/>
  </g>
  
  <!-- Floating mystical particles -->
  <g fill="#ff0033" opacity="0.7">
    <circle cx="100" cy="150" r="3"/>
    <circle cx="400" cy="200" r="2"/>
    <circle cx="150" cy="350" r="2.5"/>
    <circle cx="350" cy="100" r="2"/>
    <circle cx="450" cy="350" r="3"/>
    <circle cx="50" cy="400" r="2"/>
  </g>
</svg> 